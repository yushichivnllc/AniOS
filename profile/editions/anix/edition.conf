# Anix — bản đầy đủ nhất (Pro/Gaming).
#
# Mọi thứ của AniOS cộng thêm tầng chơi game "hết cỡ": Proton GE được nướng sẵn,
# VKD3D, protontricks, lớp kiểm chứng Vulkan cho cả 32-bit, thư viện lib32 bổ sung
# và công cụ theo dõi GPU.
# Driver NVIDIA 580xx vẫn do profile/packages.aur.x86_64 nướng sẵn như bản chính.
#
# Đây là bản ISO to nhất và lâu dựng nhất trong ba bản.

ANIOS_EDITION_ID="anix"
ANIOS_EDITION_NAME="Anix"

ANIOS_EDITION_ISO_NAME="anix"
ANIOS_EDITION_ISO_LABEL='ANIX_$(date +%Y%m)'
ANIOS_EDITION_APPLICATION="Anix Arch Linux Live Gaming Desktop (full Proton stack)"

ANIOS_EDITION_MENU_NAME="Anix"

# Giống bản chính: lớp ghi trên USB, đọc ảnh thẳng từ USB.
ANIOS_EDITION_COPYTORAM="n"
ANIOS_EDITION_PERSISTENCE=1

ANIOS_EDITION_AUR=1
ANIOS_EDITION_SOBER=1

# Nướng cả Proton chính thức lẫn Proton GE, cộng Steam Runtime.
ANIOS_EDITION_STEAM_AUTOSTART=1
ANIOS_EDITION_STEAM_PROVISION="full"
