# AniTails: nhật ký chỉ tồn tại trong RAM.
#
# Bản AniOS chính ghi journal xuống đĩa như bình thường (và lớp ghi nằm trên
# phân vùng ANIOS_PERSIST của USB). Bản amnesic thì ngược lại: mục tiêu là sau khi
# tắt máy không còn dấu vết nào của phiên, nên journal phải ở chế độ volatile —
# systemd-journald giữ mọi thứ trong /run/log/journal (tmpfs) và không tạo
# /var/log/journal.
#
# Lưu ý: đây là chống "dấu vết để lại trên đĩa", KHÔNG phải chống forensic trên
# RAM đang chạy. Ai có quyền đọc RAM khi máy còn bật vẫn đọc được nhật ký.
[Journal]
Storage=volatile
# Giữ journal nhỏ: /run là tmpfs, journal phình ra là ăn thẳng vào RAM.
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M
# Không ghi gì ra đĩa kể cả khi có phân vùng ghi được.
ForwardToSyslog=no
