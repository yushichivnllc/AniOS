# AniTails: ngẫu nhiên hoá địa chỉ MAC để card mạng không mang danh tính cố định.
#
# MAC là định danh ghi cứng trong card, theo máy qua mọi mạng và mọi phiên live,
# nên nó là cách dễ nhất để nhận ra "cùng một máy" giữa các lần kết nối. Bản
# amnesic sinh MAC ngẫu nhiên cho MỌI kết nối, kể cả kết nối đã lưu.
#
# AniOS bản chính KHÔNG bật cái này: máy phòng net cần MAC ổn định để nhà mạng
# và bộ định tuyến nhận diện.
#
# wifi.scan-rand-mac-address=yes là mặc định của NetworkManager rồi; đặt lại
# tường minh để không phụ thuộc mặc định đó đổi theo phiên bản.
[device]
wifi.scan-rand-mac-address=yes

[connection]
# 2 = stable-ssid: MAC ngẫu nhiên nhưng ổn định theo tên mạng, để không phải
# xác thực lại mỗi lần vào cùng một Wi-Fi. Đổi sang 1 (random) nếu muốn MAC mới
# sau mỗi lần kết nối.
wifi.cloned-mac-address=stable-ssid
ethernet.cloned-mac-address=random
# Không gửi hostname thật của máy lên DHCP: mọi máy AniTails báo cùng một tên.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
