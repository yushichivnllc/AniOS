# AniTails — bản amnesic (kiểu Tails), chạy hoàn toàn trong RAM.
#
# Khác biệt cốt lõi so với AniOS: KHÔNG có lớp ghi bền vững. Ảnh hệ thống được
# chép vào RAM (copytoram=y), mọi thứ ghi trong phiên nằm trên tmpfs và mất hẳn
# khi tắt máy. Vì vậy:
#   * anios-persist.service bị mask (không được phép tạo phân vùng ANIOS_PERSIST);
#   * menu khởi động không có mục "with persistent storage";
#   * journald chỉ ghi ra RAM, không còn file log trên đĩa;
#   * Steam/game/AI bị cắt để ảnh nhỏ và bề mặt tấn công hẹp.

ANIOS_EDITION_ID="aniterals"
ANIOS_EDITION_NAME="AniTails"

ANIOS_EDITION_ISO_NAME="aniterals"
ANIOS_EDITION_ISO_LABEL='ANITALS_$(date +%Y%m)'
ANIOS_EDITION_APPLICATION="AniTails Arch Linux Live Amnesic Privacy Desktop"

ANIOS_EDITION_MENU_NAME="AniTails"

# copytoram=y: mkinitcpio-archiso chép airootfs.sfs vào RAM rồi chạy từ đó.
# cow_spacesize đặt lớn vì đây là nơi duy nhất dữ liệu tồn tại trong phiên.
ANIOS_EDITION_COPYTORAM="y"
ANIOS_EDITION_COW_SPACE_SIZE="8G"
ANIOS_EDITION_PERSISTENCE=0

# Không AUR: bản này không có bộ cài đặt đồ hoạ và không cần yay. Giữ ảnh nhỏ
# và bỏ được các gói đóng gói lại từ .deb của bên thứ ba (Cốc Cốc, Jan, LM Studio).
ANIOS_EDITION_AUR=0
ANIOS_EDITION_SOBER=0

# Không Steam: bản amnesic nhắm riêng tư, không nhắm chơi game.
ANIOS_EDITION_STEAM_AUTOSTART=0
ANIOS_EDITION_STEAM_PROVISION="off"
