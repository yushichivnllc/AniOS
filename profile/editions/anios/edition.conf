# AniOS — bản chính (mặc định).
#
# File này được scripts/build-iso.sh `source` khi dựng với `--edition anios`
# (hoặc khi không truyền --edition). Mọi biến đều có giá trị mặc định trong
# build-iso.sh, nên file chỉ cần ghi những gì bản này muốn khác mặc định; nhưng
# khai báo tường minh ở đây để ba bản edition đọc lên là hiểu ngay chúng khác nhau
# chỗ nào.
#
# Bản này GIỮ NGUYÊN hành vi của AniOS trước khi có khái niệm edition: cùng gói,
# cùng menu khởi động, cùng lớp ghi ANIOS_PERSIST trên USB, cùng Steam.

ANIOS_EDITION_ID="anios"
ANIOS_EDITION_NAME="AniOS"

# Tên file ISO và nhãn volume. Nhãn dùng $(date) nên được ghi thẳng vào
# profiledef.sh để mkarchiso tự tính lúc dựng (giống releng).
ANIOS_EDITION_ISO_NAME="anios"
ANIOS_EDITION_ISO_LABEL='ANIOS_$(date +%Y%m)'
ANIOS_EDITION_APPLICATION="AniOS Arch Linux Live Gaming Desktop"

# Chuỗi hiển thị trong menu khởi động (Syslinux/GRUB/EFI): "AniOS Live".
ANIOS_EDITION_MENU_NAME="AniOS"

# Lớp ghi nằm trên phân vùng ANIOS_PERSIST của USB, đọc ảnh thẳng từ USB
# (copytoram=n). Đây là điểm AniOS cố tình khác Tails.
ANIOS_EDITION_COPYTORAM="n"
ANIOS_EDITION_PERSISTENCE=1

# Dựng gói AUR (Calamares, yay, Cốc Cốc, driver NVIDIA 580xx...).
ANIOS_EDITION_AUR=1
# Sober (Roblox) từ Flathub.
ANIOS_EDITION_SOBER=1

# Steam: tự khởi động cùng desktop và nướng sẵn Proton + Steam Runtime vào ảnh.
ANIOS_EDITION_STEAM_AUTOSTART=1
ANIOS_EDITION_STEAM_PROVISION="standard"
