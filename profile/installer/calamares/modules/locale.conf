# Múi giờ mặc định của hệ thống AniOS cài bằng Calamares.
#
# Không có file này, Calamares dùng locale.conf gốc của gói: region "America",
# zone "New_York" kèm geoip style "json" hỏi geoip.kde.org. Kết quả là máy cài
# xong chạy giờ New York (lệch 11-12 tiếng so với Việt Nam) nếu không có mạng,
# còn có mạng thì giờ lấy theo vị trí IP — mà trạm net ra Internet qua NAT/proxy
# của nhà mạng nên IP hay bị định vị sang nước khác, rồi Calamares ghi đè luôn
# lựa chọn mặc định. Vì vậy AniOS chốt tường minh Asia/Ho_Chi_Minh (UTC+7, không
# có giờ mùa hè) và tắt geoip. Người dùng vẫn đổi được bằng bản đồ trong bộ cài;
# module locale là bước ghi /etc/localtime và /etc/locale.conf vào hệ thống đích
# (xem `locale` trong sequence của settings.conf).
#
# Không dùng useSystemTimezone: khoá đó bỏ region/zone ở trên để lấy múi giờ của
# chính phiên live, và khi không xác định được thì lại rơi về America/New_York.
# Khai báo cứng như dưới đây cho kết quả giống nhau trên mọi máy.
---
region: "Asia"
zone: "Ho_Chi_Minh"

# Arch sinh locale bằng locale-gen đọc /etc/locale.gen. Đây cũng là đường dẫn
# mặc định của Calamares; ghi rõ ra để khỏi phải dò khi Arch đổi cách làm.
localeGenPath: "/etc/locale.gen"

# Tắt dò vị trí bằng IP: tài liệu của Calamares nêu style không được hỗ trợ
# (ví dụ "none") là cách tắt geoip.
geoip:
    style: "none"
