# Keep dangerous disk actions opt-in; the user must choose a target explicitly.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices:
  - none
  - small
  - suspend
initialPartitioningChoice: none
initialSwapChoice: none

luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs" ]
directoryFilesystemRestrictions:
  - mountpoint: "/"
    allowedFilesystemTypes: [ "ext4", "btrfs" ]
    onlyWhenMountpoint: false
  - mountpoint: "efi"
    allowedFilesystemTypes: [ "fat32" ]
    onlyWhenMountpoint: true

# Never let Calamares' pre-partition cleanup unmount the USB persistence layer.
essentialMounts: [ "live-*", "control", "ventoy", "ANIOS_PERSIST" ]

# Enable LUKS and LVM; the initcpio/GRUB modules below configure the target too.
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
lvm:
  enable: true

