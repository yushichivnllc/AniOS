# Install a sanitized AniOS /etc/skel before Calamares creates the user, so the
# new home gets the chosen AniOS dotfiles without touching existing user files.
---
dontChroot: true
timeout: 180
verbose: true
script:
  - command: /usr/local/lib/anios/anios-installer-skel ${ROOT} ${gs[packagechooser_dotfiles]}
    timeout: 180
    verbose: true
