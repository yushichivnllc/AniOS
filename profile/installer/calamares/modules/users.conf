# Create one password-protected desktop user; never reuse the Live root/autologin
# policy on the installed system.
---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - audio
  - video
  - input
  - storage
  - network

sudoersGroup: wheel
sudoersConfigureWithGroup: true
autologinGroup: ""

setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 128
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, nobody ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "anios"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
presets:
  fullName:
    editable: true
  loginName:
    editable: true
