# Apply selected themes and target-only AniOS settings after users/grubcfg have
# prepared the target, but before grub-install runs grub-mkconfig.
---
dontChroot: true
timeout: 300
verbose: true
script:
  - command: /usr/local/lib/anios/anios-installer-finalize ${ROOT} ${USER} ${gs[packagechooser_grub_theme]} ${gs[packagechooser_sddm_theme]} ${gs[packagechooser_dotfiles]}
    timeout: 300
    verbose: true
