# AniOS Calamares workflow. `pacstrap` installs only the curated target manifest;
# the live image's much larger package set is never copied wholesale.
---
modules-search: [ local ]

instances:
  - id: grub_theme
    module: packagechooser
    config: packagechooser-grub.conf
  - id: sddm_theme
    module: packagechooser
    config: packagechooser-sddm.conf
  - id: dotfiles
    module: packagechooser
    config: packagechooser-dotfiles.conf
  - id: anios-pacstrap
    module: shellprocess
    config: shellprocess-anios-pacstrap.conf
  - id: anios-skel
    module: shellprocess
    config: shellprocess-anios-skel.conf
  - id: anios-finalize
    module: shellprocess
    config: shellprocess-anios-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@grub_theme
      - packagechooser@sddm_theme
      - packagechooser@dotfiles
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@anios-pacstrap
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpiocfg
      - initcpio
      - shellprocess@anios-skel
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - grubcfg
      - shellprocess@anios-finalize
      - bootloader
      - services-systemd
      - umount
  - show:
      - finished

branding: anios

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
