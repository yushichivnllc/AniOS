# AniOS: đưa module NVIDIA vào initramfs của mọi kernel.
#
# Vì sao cần, trong khi đã có /etc/modprobe.d/anios-nvidia.conf:
#   * `options nvidia-drm modeset=1` chỉ có tác dụng khi module được nạp qua
#     modprobe. Card NVIDIA rời trên máy UEFI thường bị simpledrm/efifb giữ màn
#     hình trước; nếu nvidia-drm chỉ nạp sau khi SDDM đã khởi động thì greeter
#     không có KMS device và thoát ngay (hiện tượng: đăng nhập xong quay lại
#     màn hình đăng nhập, hoặc màn hình đen).
#   * Có module trong initramfs thì nvidia-drm nhận card từ rất sớm, console và
#     greeter dùng chung framebuffer của driver.
#
# mkinitcpio >= 39 đọc các file *.conf trong /etc/mkinitcpio.conf.d và mảng
# MODULES ở đây thay cho mảng rỗng của /etc/mkinitcpio.conf. Bốn module phải khai
# báo theo đúng thứ tự phụ thuộc: nvidia → nvidia_modeset/nvidia_uvm → nvidia_drm.
MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
