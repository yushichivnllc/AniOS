# AniOS — đưa module Intel VMD vào initramfs.
#
# Mainboard Intel thế hệ 600/700 (B760, H610, Z790...) có "Intel RST/VMD" trong
# BIOS. Khi bật, ổ NVMe không hiện ra như /dev/nvme0n1 mà nằm sau một
# "RAID bus controller" của Intel; chỉ sau khi module `vmd` nạp, nhân mới tạo ra
# thiết bị NVMe con. Hệ quả trên máy thật:
#   * ảnh live không thấy ổ NVMe -> trình cài đặt không có đĩa để cài;
#   * bản cài đặt trên chính ổ đó không boot được, vì initramfs thiếu `vmd` nên
#     không tìm ra root=UUID=...
#
# `vmd` KHÔNG do hook `block` của mkinitcpio kéo vào (nó là driver PCI, không phải
# driver block), nên phải khai báo tường minh. Dùng `MODULES+=` để cộng dồn vào
# danh sách của 10-anios-nvidia.conf (drop-in được source theo thứ tự tên file);
# nếu viết `MODULES=(vmd)` thì sẽ ghi đè và đẩy module NVIDIA ra khỏi initramfs.
#
# Trên máy không bật VMD, module chỉ nạp rồi không tìm thấy thiết bị nào — vô hại.
MODULES+=(vmd)
