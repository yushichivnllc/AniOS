# AniOS + Immaterial Impulse Kitty Terminal Configuration

font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

window_padding_width 12
background_opacity 0.95
confirm_os_window_close 0

# Tokyo Night / AniOS Base Color Palette
background #0a1626
foreground #f2f8fe
cursor     #2f6be8

color0  #1b3350
color1  #d8404f
color2  #3ec3d8
color3  #edb62f
color4  #2f6be8
color5  #7e9bf0
color6  #4ea6ea
color7  #eaf4fd

color8  #2a5680
color9  #e86a76
color10 #6fd8e8
color11 #f5ca4e
color12 #6fa0f5
color13 #a3b5f7
color14 #8cc6f2
color15 #eaf4fd

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Immaterial Impulse dynamic theme integration (nếu có)
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf
include colors-matugen.conf
