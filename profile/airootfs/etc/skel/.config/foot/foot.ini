# Terminal AniOS Minimal (foot) — bảng màu Tokyo Night đồng bộ toàn desktop.
[main]
font=monospace:size=10.5
pad=12x12 center
selection-target=clipboard

[cursor]
style=beam
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

