# Starship prompt cho AniOS — bảng màu Tokyo Night, hai dòng.
# Dòng 1: người dùng · thư mục · git · thời gian chạy lệnh · đồng hồ
# Dòng 2: dấu nhắc ❯ đổi màu theo kết quả lệnh trước (❯ có trong DejaVu,
# cài sẵn trong ảnh). Icon md-* dùng Symbols Nerd Font (ttf-nerd-fonts-symbols).

add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration$fill$time
$character"""

[username]
show_always = true
style_user = "bold fg:#9ece6a"
style_root = "bold fg:#f7768e"
format = "[$user]($style) "

[hostname]
ssh_only = true
trim_at = "."
style = "fg:#7dcfff"
format = "[@ $hostname]($style) "

[directory]
home_symbol = "~"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true
style = "bold fg:#7aa2f7"
read_only_style = "fg:#e0af68"
format = "[in ](fg:#565f89)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "󰊢"
truncation_length = 16
truncation_symbol = "…"
style = "fg:#bb9af7"
format = "[on ](fg:#565f89)[$symbol $branch]($style) "

[git_status]
style = "fg:#e0af68"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "? "
modified = "~ "
staged = "+${count} "
renamed = "» "
deleted = "x "
format = "[$all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 800
format = "[took $duration](fg:#9ece6a) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#565f89"
format = "[󰅐 $time]($style)"

[fill]
symbol = " "
style = "fg:#2d3446"

[character]
success_symbol = "[❯](bold fg:#9ece6a)"
error_symbol = "[❯](bold fg:#f7768e)"

# Các module ồn ào, không cần trong phiên live.
[package]
disabled = true

[memory_usage]
disabled = true

[battery]
disabled = true
