# Màn hình khoá của phiên live AniOS.
#
# Tài khoản live không có mật khẩu và có sudo không cần mật khẩu, nên khoá màn
# hình ở đây chỉ để tránh chạm nhầm khi rời máy — không phải ranh giới bảo mật.
# Vì vậy: nhấn Enter là mở khoá, và mọi mật khẩu gõ vào cũng được chấp nhận
# (xem /etc/pam.d/anios-live). Nhờ đó người dùng không thể tự khoá mình ra
# ngoài phiên làm việc.
$font = DejaVu Sans

general {
    hide_cursor = false
    # Bỏ qua bước xác thực khi ô mật khẩu để trống.
    ignore_empty_input = true
}

auth {
    # Dùng PAM service riêng của AniOS thay vì service mặc định, để không dính
    # khoá tài khoản 10 phút của pam_faillock trên hệ thống live.
    pam:module = anios-live
}

background {
    monitor =
    path = /usr/share/anios/wallpaper.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 3
    rounding = 10
    inner_color = rgba(23, 26, 34, 0.94)
    outer_color = rgba(122, 162, 247, 1.0)
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    font_color = rgba(223, 228, 239, 1.0)
    font_family = $font
    placeholder_text = <i>Nhấn Enter để mở khoá (phiên live không có mật khẩu)</i>
    fail_text = <i>Nhấn Enter để mở khoá</i>
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 84
    font_family = $font
    color = rgba(223, 228, 239, 1.0)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = AniOS
    font_size = 22
    font_family = $font
    color = rgba(122, 162, 247, 1.0)
    position = 0, 10
    halign = center
    valign = center
}
