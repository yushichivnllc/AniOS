# Launcher AniOS Minimal (fuzzel) — Gura Blue, bo tròn nhẹ, có icon ứng dụng.
# Màu trùng Waybar/foot/mako/hyprlock; nền bán trong suốt để hyprland blur
# (layerrule namespace "fuzzel") tạo hiệu ứng frosted rẻ cho GPU.
[main]
font=monospace:size=11
prompt=" 󰍉  "
placeholder-text=Gõ tên ứng dụng để tìm...
icon-theme=Adwaita
icons-enabled=yes
match-counter=yes
lines=10
width=44
horizontal-pad=22
vertical-pad=16
inner-pad=10
layer=overlay
terminal=foot

[colors]
background=0a1626d9
text=eaf4fdff
match=4ea6eaff
selection=1e4266ff
selection-text=d9deefff
selection-match=4ea6eaff
border=2f6be8cc

[border]
width=2
