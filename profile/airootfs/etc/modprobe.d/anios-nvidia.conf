# AniOS: card NVIDIA dùng driver proprietary (nvidia-open-dkms), không dùng nouveau.
#
# - Chặn nouveau: nếu nouveau nạp trước, nó giành card với nvidia và Hyprland
#   (Wayland) không khởi động được. Không ảnh hưởng máy Intel/AMD vì nouveau chỉ
#   gắn với card NVIDIA.
# - nvidia-drm modeset=1: bật kernel mode-setting, bắt buộc để compositor Wayland
#   (Hyprland) chạy trên driver NVIDIA. fbdev=1: dùng framebuffer của nvidia-drm
#   cho console/SDDM ngay từ đầu.
#
# Lưu ý: các card NVIDIA đời cũ hơn Turing (GTX 10 trở về trước) không được driver
# mở hỗ trợ; với các máy đó cần driver nvidia-580xx-dkms (AUR) và sẽ không dùng
# được file này nguyên vẹn.
blacklist nouveau
options nvidia-drm modeset=1 fbdev=1
