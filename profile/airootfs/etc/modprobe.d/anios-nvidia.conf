# AniOS: card NVIDIA dùng driver proprietary nvidia-580xx-dkms (AUR), không dùng nouveau.
#
# - Chặn nouveau: nếu nouveau nạp trước, nó giành card với nvidia và Hyprland
#   (Wayland) không khởi động được. Không ảnh hưởng máy Intel/AMD vì nouveau chỉ
#   gắn với card NVIDIA.
# - nvidia-drm modeset=1: bật kernel mode-setting, bắt buộc để compositor Wayland
#   (Hyprland) chạy trên driver NVIDIA. fbdev=1: dùng framebuffer của nvidia-drm
#   cho console/SDDM ngay từ đầu.
#
# Vì sao 580xx: nhánh 590+ của NVIDIA đã bỏ Pascal (GTX 10) và Maxwell, còn 580xx vẫn
# hỗ trợ cả Pascal/Maxwell lẫn Turing (RTX 20, GTX 16) trở lên, nên một ảnh chạy được
# card NVIDIA từ Maxwell (GTX 9xx) đến Ada (RTX 40). Card Blackwell (RTX 50) cần nvidia-open
# nên 580xx không chạy được; driver 580xx là bản proprietary (không phải nvidia-open) và được dựng từ AUR lúc build ISO; module nạp vẫn tên `nvidia*`, nên
# file này không đổi theo phiên bản driver.
blacklist nouveau
options nvidia-drm modeset=1 fbdev=1
