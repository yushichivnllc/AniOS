# AniOS — chế độ quán net.
#
# Máy quán net là máy DÙNG CHUNG, nên có hai việc mà một máy dùng riêng không cần:
#
#   1. Khách sau không thấy dữ liệu của khách trước (phiên đăng nhập Steam, lịch
#      sử/mật khẩu trình duyệt, file tải về, clipboard).
#   2. Máy tự khởi động lại khi phiên đồ hoạ chết lặp lại, thay vì nằm im ở màn
#      hình đăng nhập chờ kỹ thuật.
#
# Mặc định file này TẮT để không ai mất dữ liệu ngoài ý muốn. Bật bằng một lệnh:
#
#     anios-cafe on            # chỉ tài khoản này (~/.config/anios/net-cafe.conf)
#     sudo anios-cafe on --system   # mọi tài khoản trên máy (sửa chính file này)
#
# hoặc thêm `anios.cafe=1` vào tham số nhân cho riêng lần khởi động đó.
#
# Kiểm tra bất cứ lúc nào: `anios-cafe` (trạng thái), `anios-cafe clean --dry-run`
# (xem sẽ xoá gì). Dọn ngay giữa hai khách, không cần đăng xuất: `anios-cafe clean`.

# Vai trò của MÁY NÀY. "gaming" = máy cho khách (dọn dữ liệu giữa các lượt),
# "pos" = máy quầy thu ngân. Máy quầy KHÔNG BAO GIỜ bị dọn dữ liệu và KHÔNG BAO
# GIỜ tự khởi động lại, dù chế độ quán net được bật cho cả dàn: hồ sơ trình duyệt
# ở quầy đang đăng nhập sẵn phần mềm bán hàng (KiotViet/MISA/Sapo/POS365...), xoá
# là mất phiên giữa ca, còn reboot giữa ca là mất hoá đơn đang tính.
#
# Đặt trên chính máy quầy bằng:  anios-cafe on --pos
# (hoặc thêm dòng dưới đây vào ~/.config/anios/net-cafe.conf của máy đó)
# ANIOS_CAFE_ROLE=pos

# Công tắc tổng. 1 = bật chế độ quán net.
# Hai công tắc bên dưới mặc định đi theo công tắc này, nhưng có thể đặt riêng.
ANIOS_CAFE_ENABLE=0

# Xoá dữ liệu khách mỗi khi bắt đầu phiên đăng nhập mới.
# ANIOS_CAFE_WIPE_ON_START=1

# Tự khởi động lại máy khi phiên đồ hoạ chết nhanh nhiều lần (xem ngưỡng dưới).
# Mỗi lần khởi động chỉ tự khởi động lại MỘT lần, để máy hỏng thật không rơi vào
# vòng lặp reboot mà không ai đọc được nhật ký.
# ANIOS_CAFE_REBOOT_ON_CRASH=1

# Ngưỡng "chết nhanh": phiên thoát với mã lỗi trong vòng 20 giây được tính là một
# lần chết nhanh (anios-session ghi lại). Đủ ANIOS_CAFE_MAX_FAST_FAILURES lần
# trong ANIOS_CAFE_FAILURE_WINDOW giây thì unit anios-cafe-watchdog.timer xử lý.
# ANIOS_CAFE_MAX_FAST_FAILURES=3
# ANIOS_CAFE_FAILURE_WINDOW=600

# Tài khoản dùng chung. Unit watchdog chạy bằng root nên cần biết đọc trạng thái
# của ai; đổi giá trị này nếu bộ cài đặt tạo tài khoản khác.
# ANIOS_CAFE_USER=anios

# Danh sách dữ liệu bị xoá hẳn (tương đối so với thư mục nhà) và danh sách thư mục
# chỉ bị dọn sạch nội dung. Mặc định nằm trong /usr/local/lib/anios/cafe.sh; chỉ
# khai báo ở đây khi quán muốn khác, ví dụ giữ lại tài khoản Steam dùng chung:
#
#   ANIOS_CAFE_WIPE_PATHS=(
#     .config/google-chrome
#     .cache/google-chrome
#     .config/coccoc
#     .cache/coccoc
#   )
#
# Không bao giờ bị đụng tới: dotfiles Hyprland/quickshell, ~/Desktop (lối tắt của
# ảnh), ~/.local/share/anios (nhật ký phiên cho anios-gpu-doctor) và mọi thứ nằm
# ngoài thư mục nhà của tài khoản.
