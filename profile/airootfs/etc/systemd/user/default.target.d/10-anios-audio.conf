# AniOS live: bảo đảm dàn âm thanh luôn khởi động cùng phiên người dùng.
#
# PipeWire, pipewire-pulse và WirePlumber chạy dưới dạng unit của systemd --user.
# Trên một bản Arch bình thường, các gói tự bật chúng bằng
# `systemctl --global enable` trong scriptlet post_install lúc cài. Trong ảnh
# live, scriptlet đó chạy bên trong chroot của pacstrap, nên symlink "đã bật"
# hoàn toàn có thể không được tạo; khi đó không có gì khởi động dàn âm thanh và
# máy câm hoàn toàn (Waybar không hiện âm lượng, Firefox/Steam báo không có
# thiết bị xuất).
#
# Drop-in này nạp thẳng các unit đó vào default.target của systemd --user. Nội
# dung [Unit] của drop-in có hiệu lực ngay khi systemd nạp default.target, nên
# âm thanh vẫn chạy dù bản dựng thiếu symlink. Các symlink cùng mục đích nằm ở
# etc/systemd/user/{default.target.wants,sockets.target.wants} và
# pipewire.service.wants (giống hệt trạng thái `systemctl --user enable` tạo ra).
#
# anios-audio-setup.service chạy sau cùng: chờ thiết bị xuất xuất hiện, bỏ
# trạng thái tắt tiếng mặc định của card và tự sửa khi chưa có thiết bị xuất.
[Unit]
Wants=pipewire.service pipewire-pulse.service wireplumber.service
Wants=anios-audio-setup.service
After=pipewire.service pipewire-pulse.service wireplumber.service
