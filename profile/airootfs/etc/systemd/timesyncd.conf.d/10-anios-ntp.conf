# Cấu hình systemd-timesyncd cho phiên AniOS Live.
#
# Đồng hồ của phiên live lấy từ RTC của máy quán net. Nhiều máy chạy song song
# Windows nên RTC dễ lệch, mà chỉ cần đồng hồ sai là MỌI bắt tay TLS thất bại:
# Steam báo "needs to be online to update", trình duyệt báo lỗi chứng chỉ. Đó là
# bước 1/6 mà anios-netcheck kiểm tra.
#
# releng của archiso không bật systemd-timesyncd, nên profile bật nó
# (etc/systemd/system/multi-user.target.wants/systemd-timesyncd.service) và ghim
# máy chủ NTP về cụm châu Á: mặc định của systemd trên Arch là cụm
# *.arch.pool.ntp.org, vừa xa vừa có lúc không phân giải được trên mạng phòng
# net. FallbackNTP giữ lại cụm của Arch và pool quốc tế để vẫn còn đường đồng bộ
# khi cụm châu Á không trả lời.
#
# Kiểm tra bằng: timedatectl, anios-netcheck.
[Time]
NTP=0.asia.pool.ntp.org 1.asia.pool.ntp.org 2.asia.pool.ntp.org 3.asia.pool.ntp.org
FallbackNTP=0.arch.pool.ntp.org 1.arch.pool.ntp.org pool.ntp.org
