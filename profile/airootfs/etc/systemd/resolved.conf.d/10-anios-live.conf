# Cấu hình systemd-resolved cho phiên AniOS Live.
#
# releng của archiso đã ship etc/systemd/resolved.conf.d/archiso.conf
# (MulticastDNS=yes) và bật systemd-resolved.service; /etc/resolv.conf của ảnh
# live là symlink tới /run/systemd/resolve/stub-resolv.conf.
#
# Ảnh live chạy trên mạng phòng net: DHCP có thể không phát máy chủ DNS nào, máy
# chủ DNS của nhà mạng có thể không trả lời, còn systemd-resolved chỉ hỏi
# FallbackDNS khi KHÔNG có máy chủ DNS nào từ link. Khi đó resolved trả lời
# SERVFAIL cho mọi tên, và biểu hiện đầu tiên người dùng thấy là Steam báo
# "Steam needs to be online to update" trong khi trình duyệt vẫn mở được web.
# Đặt FallbackDNS tường minh (DNS công cộng) thay vì tin vào mặc định của bản
# systemd đang cài; máy chủ DNS do DHCP phát vẫn được ưu tiên như bình thường.
#
# Kiểm tra bằng: resolvectl status, anios-netcheck.
[Resolve]
FallbackDNS=1.1.1.1 8.8.8.8 9.9.9.9 149.112.112.112 2606:4700:4700::1111 2001:4860:4860::8888
# Giữ cache nhỏ: Steam hỏi lại cùng một loạt tên CDN rất nhiều lần, cache giúp
# ích khi DNS của mạng chậm hoặc chập chờn.
Cache=yes
