# zram là swap nén trong RAM (cấu hình ở /etc/systemd/zram-generator.conf).
# Đẩy trang nguội vào zram sớm và đọc theo từng trang nhỏ để giảm độ trễ.
vm.swappiness=100
vm.page-cluster=0

# Hệ live ghi lên USB (lớp ghi ANIOS_PERSIST). Mặc định kernel gom dirty page tới vài trăm MB
# rồi xả một lần, khiến cả giao diện đứng hình vài giây trên USB chậm. Giới hạn nhỏ để xả
# đều và sớm, đồng thời `sync` lúc tắt máy cũng ngắn hơn.
vm.dirty_background_bytes=16777216
vm.dirty_bytes=67108864
# Giữ cache dentry/inode lâu hơn: duyệt thư mục (Thunar, Steam, overlayfs) đỡ phải đọc lại USB.
vm.vfs_cache_pressure=50
