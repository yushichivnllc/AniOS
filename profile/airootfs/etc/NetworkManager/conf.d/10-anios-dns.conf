# DNS của phiên live do systemd-resolved đảm nhiệm.
#
# Vì sao phải ghi rõ thay vì để NetworkManager tự dò: releng của archiso ship sẵn
# /etc/resolv.conf là symlink tới /run/systemd/resolve/stub-resolv.conf và bật
# systemd-resolved.service. NetworkManager chỉ tự chuyển sang plugin này khi nó
# nhận ra symlink đó lúc khởi động (rc-manager=auto). Ghi thẳng ở đây để một thay
# đổi của releng (hoặc một drop-in khác) không âm thầm làm NM ghi đè
# /etc/resolv.conf bằng DNS DHCP, trong khi tiến trình phân giải thật của ảnh live
# là resolved.
#
# Kèm theo: etc/systemd/resolved.conf.d/10-anios-live.conf đặt FallbackDNS để
# resolved không bao giờ ở trạng thái "không có máy chủ DNS nào" — đúng trạng thái
# khiến Steam báo "needs to be online to update".
[main]
dns=systemd-resolved
