# AniOS live desktop: Hyprland gọn nhẹ, hợp với GPU tích hợp đời cũ trong quán net.
$mainMod = SUPER
$terminal = foot
$menu = fuzzel

monitor = ,preferred,auto,1

# fcitx5 + Unikey cho tiếng Việt (bật/tắt bằng Ctrl+Space), sau đó là thanh trạng thái.
exec-once = fcitx5 -d
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swaybg -i /usr/share/anios/wallpaper.png

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    layout = dwindle
    allow_tearing = false
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(444a5eff)
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

bind = $mainMod, D, exec, $menu
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, thunar
bind = $mainMod, F, fullscreen
bind = $mainMod, SPACE, togglefloating
bind = $mainMod SHIFT, SPACE, pin
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, E, exit
bind = $mainMod SHIFT, R, exec, hyprctl reload

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

# bindl: phím chỉnh âm lượng vẫn hoạt động khi màn hình đang khoá.
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
