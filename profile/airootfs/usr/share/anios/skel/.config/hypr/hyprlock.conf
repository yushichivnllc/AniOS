# Màn hình khoá của phiên live AniOS.
#
# Tài khoản live dùng cùng mật khẩu 1111 cho SDDM, sudo và màn hình khoá.
# Đây là mật khẩu cố ý đơn giản cho môi trường live tạm thời; không dùng
# phiên live này cho dữ liệu riêng tư hoặc trên mạng không đáng tin cậy.
#
# Bố cục: wordmark AniOS trên cùng, đồng hồ lớn + ngày ở giữa, ô mật khẩu
# phía dưới kèm cảnh báo Caps Lock. Nền là wallpaper AniOS được chính
# hyprlock làm mờ (blur chạy một lần lúc khoá, không tốn GPU của phiên).

$font       = Noto Sans
$accent     = rgba(122, 162, 247, 1.0)
$text       = rgba(217, 222, 234, 1.0)
$dim        = rgba(138, 147, 168, 1.0)
$surface    = rgba(23, 26, 34, 0.82)
$border     = rgba(45, 52, 70, 1.0)
$fail       = rgba(247, 118, 142, 1.0)
$caps       = rgba(224, 175, 104, 1.0)

general {
    hide_cursor = false
    # Không cho phép bỏ qua xác thực bằng cách nhấn Enter.
    ignore_empty_input = false
}

auth {
    # Dùng PAM service riêng của AniOS để xác thực mật khẩu live mà không dính
    # pam_faillock của system-auth trên một tài khoản tạm thời.
    pam:module = anios-live
}

background {
    monitor =
    path = /usr/share/anios/wallpaper.png
    color = rgba(16, 18, 24, 1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.6
}

# Wordmark AniOS + dòng giới thiệu hệ nền.
label {
    monitor =
    text = AniOS
    font_family = $font
    font_size = 26
    color = $accent
    position = 0, 268
    halign = center
    valign = center
}

label {
    monitor =
    text = Hyprland live gaming desktop · Arch Linux based
    font_family = $font
    font_size = 12
    color = $dim
    position = 0, 240
    halign = center
    valign = center
}

# Đồng hồ lớn giữa màn hình.
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 96
    color = $text
    position = 0, 100
    halign = center
    valign = center
}

# Ngày trong tuần ngay dưới đồng hồ.
label {
    monitor =
    text = cmd(date +'%A, %d/%m/%Y')
    font_family = $font
    font_size = 15
    color = $dim
    position = 0, 28
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 52
    outline_thickness = 2
    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    rounding = 14
    inner_color = $surface
    outer_color = $border
    check_color = $accent
    fail_color = $fail
    font_color = $text
    font_family = $font
    font_size = 15
    placeholder_text = <i>Nhập mật khẩu AniOS để mở khoá</i>
    fail_text = <i>Mật khẩu không đúng, thử lại nhé</i>
    position = 0, -70
    halign = center
    valign = center
}

# Cảnh báo Caps Lock (script đi kèm trong thư mục hyprlock/).
label {
    monitor =
    text = cmd[update:1000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    font_family = $font
    font_size = 12
    color = $caps
    position = 0, -122
    halign = center
    valign = center
}

# Nhắc mật khẩu live: môi trường live không có dữ liệu riêng tư, và mật khẩu
# này đã được ghi trong motd cùng Desktop/README.txt từ trước.
label {
    monitor =
    text = Mật khẩu phiên live: 1111
    font_family = $font
    font_size = 11
    color = $dim
    position = 0, -268
    halign = center
    valign = center
}
