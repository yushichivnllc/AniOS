# Màn hình khoá của phiên live AniOS.
#
# Tài khoản live dùng cùng mật khẩu 1111 cho SDDM, sudo và màn hình khoá.
# Đây là mật khẩu cố ý đơn giản cho môi trường live tạm thời; không dùng
# phiên live này cho dữ liệu riêng tư hoặc trên mạng không đáng tin cậy.
$font = DejaVu Sans

general {
    hide_cursor = false
    # Không cho phép bỏ qua xác thực bằng cách nhấn Enter.
    ignore_empty_input = false
}

auth {
    # Dùng PAM service riêng của AniOS để xác thực mật khẩu live mà không dính
    # pam_faillock của system-auth trên một tài khoản tạm thời.
    pam:module = anios-live
}

background {
    monitor =
    path = /usr/share/anios/wallpaper.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 3
    rounding = 10
    inner_color = rgba(23, 26, 34, 0.94)
    outer_color = rgba(122, 162, 247, 1.0)
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    font_color = rgba(223, 228, 239, 1.0)
    font_family = $font
    placeholder_text = <i>Nhập mật khẩu AniOS để mở khoá</i>
    fail_text = <i>Mật khẩu không đúng</i>
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 84
    font_family = $font
    color = rgba(223, 228, 239, 1.0)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = AniOS
    font_size = 22
    font_family = $font
    color = rgba(122, 162, 247, 1.0)
    position = 0, 10
    halign = center
    valign = center
}
