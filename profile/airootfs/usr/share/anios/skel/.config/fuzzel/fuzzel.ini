# Launcher AniOS Minimal (fuzzel) — Tokyo Night, bo tròn nhẹ, có icon ứng dụng.
# Màu trùng Waybar/foot/mako/hyprlock; nền bán trong suốt để hyprland blur
# (layerrule namespace "fuzzel") tạo hiệu ứng frosted rẻ cho GPU.
[main]
font=monospace:size=11
prompt=" 󰍉  "
placeholder-text=Gõ tên ứng dụng để tìm...
icon-theme=Adwaita
icons-enabled=yes
match-counter=yes
lines=10
width=44
horizontal-pad=22
vertical-pad=16
inner-pad=10
layer=overlay
terminal=foot

[colors]
background=171a22d9
text=c0caf5ff
match=7dcfffff
selection=2d3446ff
selection-text=d9deefff
selection-match=7dcfffff
border=7aa2f7cc

[border]
width=2
