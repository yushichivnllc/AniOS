# Terminal AniOS Minimal (foot) — bảng màu Gura Blue đồng bộ toàn desktop.
[main]
font=monospace:size=10.5
pad=12x12 center
selection-target=clipboard

[cursor]
style=beam
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[colors]
alpha=0.94
background=0a1626
foreground=eaf4fd
regular0=1b3350
regular1=d8404f
regular2=3ec3d8
regular3=edb62f
regular4=2f6be8
regular5=7e9bf0
regular6=4ea6ea
regular7=eaf4fd
bright0=2a5680
bright1=e86a76
bright2=6fd8e8
bright3=f5ca4e
bright4=6fa0f5
bright5=a3b5f7
bright6=8cc6f2
bright7=eaf4fd
selection-foreground=f2f8fe
selection-background=1e4266
