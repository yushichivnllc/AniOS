# AniOS Kitty Terminal Configuration

font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

window_padding_width 8
background_opacity 0.95

# Tokyo Night / AniOS Color Palette
background #171a22
foreground #d9deea
cursor     #7aa2f7

color0  #252a36
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #c0caf5

color8  #414868
color9  #ff899d
color10 #9fe044
color11 #ff9e64
color12 #7da6ff
color13 #c0a2ff
color14 #7de3f2
color15 #c0caf5

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
