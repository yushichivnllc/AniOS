[Settings]
# GTK của AniOS Minimal: nền tối Tokyo Night, font Noto, con trỏ Adwaita cỡ 24.
# Ở chế độ Immaterial Impulse, matugen/kde-material-you-colors có thể ghi đè
# các giá trị này bằng bảng màu Material sinh ra từ wallpaper.
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
gtk-dialogs-use-header=1
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
gtk-decoration-layout=:close
