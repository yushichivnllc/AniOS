# Cấu hình ruff cho toàn repo (dùng chung cho cả hai app trong apps/).
#
# Vì sao có file này: trước đó repo KHÔNG có bất kỳ cấu hình lint nào, nên
# `ruff check` chạy với bộ quy tắc mặc định và báo hàng trăm lỗi — phần lớn là
# quy ước về kiểu dữ liệu, không phải lỗi thật. Bộ quy tắc ở đây được chọn
# theo đúng nguyên tắc của dự án:
#
#   * E4/E7/E9 + F  — lỗi cú pháp và lỗi thật (biến dùng chưa, import thừa).
#   * I              — import phải xếp đúng thứ tự, để đọc code của nhau.
#   * B              — bugbear: bắt lỗi Python thường gặp (mutable default,
#                     except thiếu xử lý, so sánh sai...).
#   * UP             — pyupgrade: giữ code đúng kiểu cho Python 3.11+.
#
# Những gì CỐ TÌNH không bật: S (bandit) vì app đọc file người dùng chọn là
# bản chất của trình đọc truyện; BLE/TRY vì code báo lỗi bằng thông điệp
# tiếng Việt theo quy ước riêng; RUF100 vì repo dùng `# noqa` có chủ đích.

line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", ".venv-dev"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# B008: `def parent(self, index=QModelIndex())` là idiom chuẩn của Qt (giá trị mặc
# định của tham số hàm bị gọi trước khi hàm chạy), không phải lỗi.
ignore = ["B008"]

[lint.isort]
# Gói app nằm trong apps/<tên>/, không nằm ở gốc repo, nên ruff không tự đoán
# ra đây là mã của dự án. Khai báo tường minh để import của PyPI (PySide6…)
# luôn nằm TRƯỚC mã của dự án.
known-first-party = ["anios_manga", "anios_reddit", "conftest"]

[lint.per-file-ignores]
# Test dùng import trong thân hàm để chọn bộ backend tuỳ môi trường.
"*/tests/*" = ["E402", "B011"]
