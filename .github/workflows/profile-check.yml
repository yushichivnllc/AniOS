name: AniOS profile checks

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua for Hyprland config checks
        run: sudo apt-get update && sudo apt-get install -y lua5.4 python3-yaml
      - name: Check shell syntax and profile structure
        env:
          LUA: lua5.4
        run: ./scripts/check-profile.sh
      - name: Self-test the AUR build helper
        # scripts/anios-aur-build.sh chỉ chạy bên trong chroot airootfs lúc dựng
        # ISO. Bài này thay pacman/makepkg/git/curl/runuser/useradd... bằng bản giả
        # có ghi nhật ký lời gọi, rồi chạy đúng script đó trên một airootfs giả để
        # bắt ngay những lỗi: đọc sai manifest, cài sai phụ thuộc từ .SRCINFO,
        # chạy makepkg bằng root, quên pacman -U gói đã dựng, dọn mồ côi làm mất
        # gói của ảnh live, cấp sudo/NOPASSWD, và "một gói AUR dựng hỏng mà bản
        # dựng vẫn báo thành công" (ISO thiếu gói nhưng CI xanh).
        run: ./scripts/selftest-anios-aur-build.sh
      - name: Self-test the live AUR/package checker
        # scripts/check-live-aur.sh đọc airootfs.sfs thật trong workflow dựng ISO.
        # Bài này chạy đúng logic đó trên một ảnh live giả (unsquashfs giả mô
        # phỏng việc từ chối symlink tuyệt đối của `-cat`) để chắc nó không báo
        # thiếu sai và không bỏ sót rác của bước dựng gói AUR.
        run: ./scripts/selftest-check-live-aur.sh
      - name: Self-test the NOPASSWD leak check of the ISO build
        # Bước cuối của scripts/build-iso.sh chỉ chạy sau khi mkarchiso dựng xong
        # (~25 phút), nên lỗi ở đó chỉ lộ ra rất muộn. Từng có lỗi: gói sudo của Arch
        # ship /etc/sudoers kèm dòng ví dụ đã comment `# %wheel ... NOPASSWD: ALL`,
        # grep thô chữ NOPASSWD khớp nó và bản dựng chết với "A NOPASSWD sudo rule
        # leaked" trên một ảnh sạch. Bài này nạp đúng hàm sudoers_nopasswd_rules từ
        # build-iso.sh rồi chạy trên airootfs giả: sudoers mặc định phải sạch, còn
        # luật NOPASSWD thật (kể cả khi ai đó bỏ comment dòng ví dụ) phải bị bắt.
        run: ./scripts/selftest-build-iso-sudoers.sh
      - name: Self-test the live audio checker
        # scripts/check-live-audio.sh chạy trên airootfs.sfs thật trong workflow
        # dựng ISO. Bài này chạy đúng logic đó trên một ảnh live giả (unsquashfs
        # giả mô phỏng việc từ chối symlink tuyệt đối) nên lỗi kiểu "ảnh live có
        # file nhưng bước kiểm tra báo thiếu" bị bắt trong vài giây, không phải
        # sau một lượt dựng ISO dài.
        run: ./scripts/selftest-check-live-audio.sh
      - name: Self-test the live network checker
        # scripts/anios-netcheck chạy trong phiên live khi Steam báo "needs to be
        # online to update". Bài này giả lập getent/curl/nmcli/resolvectl để chạy
        # đúng script đó trên cây /etc giả: DNS chết hẳn, DNS chỉ hỏng với tên
        # Valve, IPv6 "nửa sống", captive portal trả HTML, các bước --fix/--fix-dns
        # và chế độ --quiet dùng cho unit lúc boot đều phải hoạt động.
        run: ./scripts/selftest-anios-netcheck.sh
      - name: Self-test Calamares installer helpers
        # Chạy pacstrap, skeleton cleanup, theme finalizer và các lựa chọn dotfiles
        # trên cây hệ thống giả; không cài gì lên runner.
        run: ./scripts/selftest-installer.sh
      - name: Validate JSON, SDDM theme, and session configuration
        run: |
          python3 - <<'PY'
          import configparser
          import json
          import pathlib
          import re

          root = pathlib.Path("profile/airootfs")
          json.loads((root / "usr/share/anios/skel/.config/waybar/config").read_text())

          sddm = configparser.ConfigParser(interpolation=None)
          sddm.read(root / "etc/sddm.conf.d/10-anios-autologin.conf")
          assert sddm["Autologin"]["User"] == "anios"
          assert sddm["Autologin"]["Session"] == "anios"
          assert sddm["Theme"]["Current"] == "wuwa"

          wuwa_dir = root / "usr/share/sddm/themes/wuwa"
          wuwa_conf = configparser.ConfigParser(interpolation=None)
          wuwa_conf.read(wuwa_dir / "theme.conf")
          assert wuwa_conf["General"]["background"] == "bg.mp4"
          for asset in ("Main.qml", "bg.mp4", "fallback.png", "logo.png", "metadata.desktop", "UPSTREAM"):
              assert (wuwa_dir / asset).is_file() and (wuwa_dir / asset).stat().st_size > 0

          theme_conf = configparser.ConfigParser(interpolation=None)
          theme_conf.read(root / "usr/share/sddm/themes/anios/theme.conf")
          assert theme_conf["General"]["background"] == "/usr/share/anios/wallpaper.png"

          session = configparser.ConfigParser(interpolation=None)
          session.read(root / "usr/share/wayland-sessions/anios.desktop")
          assert session["Desktop Entry"]["Exec"] == "/usr/local/bin/anios-session"
          assert session["Desktop Entry"]["TryExec"] == "/usr/local/bin/anios-session"

          # QML không có parser sẵn trong Python, nên chỉ kiểm tra những lỗi
          # hay gặp khi sửa tay: ngoặc lệch và thiếu khai báo bắt buộc.
          qml = (root / "usr/share/sddm/themes/anios/Main.qml").read_text()

          def strip_qml(text):
              text = re.sub(r"/\*.*?\*/", "", text, flags=re.S)
              text = re.sub(r"//[^\n]*", "", text)
              return re.sub(r'"(?:\\.|[^"\\])*"', '""', text)

          code = strip_qml(qml)
          for opener, closer in (("{", "}"), ("(", ")"), ("[", "]")):
              assert code.count(opener) == code.count(closer), \
                  f"unbalanced {opener}{closer} in the SDDM theme"
          for required in ("import SddmComponents 2.0", "sddm.login(", "config.background",
                           "sessionModel", "userModel"):
              assert required in qml, f"SDDM theme is missing {required}"

          wuwa_qml = (root / "usr/share/sddm/themes/wuwa/Main.qml").read_text()
          wuwa_code = strip_qml(wuwa_qml)
          for opener, closer in (("{", "}"), ("(", ")"), ("[", "]")):
              assert wuwa_code.count(opener) == wuwa_code.count(closer), \
                  f"unbalanced {opener}{closer} in the Wuthering Waves theme"
          for required in ('import QtMultimedia', 'fallback.png', 'interval: 1200',
                           'bgVideoPlayer.source = Qt.resolvedUrl("bg.mp4")',
                           'onErrorOccurred: root.videoReady = false',
                           'sddm.login(uname, passIn.text, root.sessionIndex)'):
              assert required in wuwa_qml, f"Wuthering Waves SDDM theme is missing {required}"

          # /etc/os-release là shell script; chỉ cần vài dòng định danh.
          os_release = (root / "etc/os-release").read_text().splitlines()
          assert 'NAME="AniOS"' in os_release
          assert 'ID=arch' in os_release
          assert any(line.startswith('PRETTY_NAME="AniOS (') for line in os_release)
          import yaml

          calamares_root = pathlib.Path("profile/installer/calamares")
          for config_path in calamares_root.rglob("*.conf"):
              yaml.safe_load(config_path.read_text())
          yaml.safe_load((calamares_root / "branding/anios/branding.desc").read_text())
          settings = yaml.safe_load((calamares_root / "settings.conf").read_text())
          execution = next(step["exec"] for step in settings["sequence"] if "exec" in step)
          required_order = ["shellprocess@anios-pacstrap", "shellprocess@anios-skel", "users",
                            "grubcfg", "shellprocess@anios-finalize", "bootloader"]
          positions = [execution.index(module) for module in required_order]
          assert positions == sorted(positions), "Calamares install jobs are in an unsafe order"
          assert ("default", "gorgeous-grubphemous") == tuple(
              item["id"] for item in yaml.safe_load(
                  (calamares_root / "modules/packagechooser-grub.conf").read_text())["items"])
          assert ("anios", "wuwa") == tuple(
              item["id"] for item in yaml.safe_load(
                  (calamares_root / "modules/packagechooser-sddm.conf").read_text())["items"])
          assert ("imi", "end4") == tuple(
              item["id"] for item in yaml.safe_load(
                  (calamares_root / "modules/packagechooser-dotfiles.conf").read_text())["items"])

          print("JSON, SDDM theme, Calamares YAML, install sequence, and AniOS identity parse successfully")
          PY
