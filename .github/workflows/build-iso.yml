# Dựng ISO AniOS tự động bằng Archiso trong container Arch Linux.
# Kết quả được lưu thành artifact của workflow và (tuỳ chọn) đính kèm vào GitHub Release.
name: Build AniOS ISO

on:
  # Đẩy tag, ví dụ v1.0.0 -> dựng ISO rồi tạo release "AniOS v1.0.0"
  push:
    tags:
      - 'v*'
  # Thay đổi profile/script trong pull request: dựng thử ISO để bắt lỗi trước
  # khi merge (không tạo release, chỉ lưu artifact).
  pull_request:
    paths:
      - 'profile/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-iso.yml'
  # Chạy tay: tab Actions -> Build AniOS ISO -> Run workflow
  workflow_dispatch:
    inputs:
      publish:
        description: 'Công bố bản dựng thành release "nightly"'
        type: boolean
        default: false
  # Dựng lại hằng tuần để ISO bám theo kho gói rolling của Arch
  schedule:
    - cron: '23 18 * * 0' # Chủ nhật, 18:23 UTC

# Cần quyền ghi nội dung để tạo/cập nhật GitHub Release.
permissions:
  contents: write

# Không huỷ bản đang chạy: mỗi lần dựng mất hàng chục phút và nhiều GB dung lượng.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Dựng ISO
    runs-on: ubuntu-latest
    # pacstrap + mksquashfs + xorrisofs cần khá nhiều thời gian và đĩa; bước dựng
    # gói AUR (yay biên dịch từ mã nguồn Go, Cốc Cốc tải .deb vài trăm MB) cộng
    # thêm wine/nodejs/python làm ảnh phình ra nên lượt dựng dài hơn trước.
    timeout-minutes: 180
    # Dùng Docker trực tiếp thay cho job `container:`: GitHub Actions tự gắn
    # job container vào network riêng, xung đột với --network=host cần cho pacstrap.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải phóng dung lượng đĩa
        # Ảnh runner mặc định để lại rất ít chỗ trống; đổi lấy khoảng 25 GB cho lượt dựng ISO.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Khởi chạy container Arch để dựng ISO
        # Chạy Docker trực tiếp trên runner để --network=host không bị network
        # riêng do GitHub Actions tạo cho job container ghi đè.
        run: |
          docker run --detach \
            --name anios-iso-builder \
            --privileged \
            --network host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env GITHUB_WORKSPACE=/workspace \
            --entrypoint tail \
            archlinux:base-devel \
            -f /dev/null

      - name: Cài archiso và công cụ dựng ISO
        # archiso kéo theo pacman, mkinitcpio-archiso, xorriso...; các gói còn lại là
        # host tool mà mkarchiso yêu cầu (mksquashfs, mkfs.fat, mmd/mcopy, xorriso).
        run: |
          docker exec -i anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          # lua: kiểm tra cú pháp + nạp thử cả hai chế độ Hyprland ngay trên CI.
          # grub: cung cấp grub-mkstandalone cho bootmode uefi.grub (theme Evangelion Ayanami).
          packages=(archiso grub squashfs-tools dosfstools mtools libisoburn git lua)
          pacman-key --init 2>/dev/null || true
          pacman-key --populate archlinux 2>/dev/null || true
          if ! pacman -Syu --noconfirm --needed "${packages[@]}"; then
            # Ảnh container có thể cũ hơn kho mirror, khiến pacman báo lỗi chữ ký.
            echo "::warning::Cài thất bại, đang làm mới archlinux-keyring rồi thử lại"
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman-key --populate archlinux 2>/dev/null || true
            pacman -Syu --noconfirm --needed "${packages[@]}"
          fi
          # Profile releng mà scripts/build-iso.sh dùng làm nền tảng.
          test -d /usr/share/archiso/configs/releng
          pacman -Q archiso squashfs-tools libisoburn
          ARCH

      - name: Kiểm tra profile
        run: docker exec anios-iso-builder /workspace/scripts/check-profile.sh

      - name: Kiểm tra quyền mount của container
        # Probe phải lặp lại đúng những gì pacstrap (hàm chroot_setup của
        # arch-install-scripts) mount vào airootfs, kể cả tên filesystem type mà
        # kernel đăng ký: "sysfs" chứ không phải "sys", "devtmpfs" chứ không phải
        # "dev". Sai tên thì mount báo "unknown filesystem type" kể cả khi container
        # có đủ quyền. Fail sớm ở đây kèm chẩn đoán thay vì chờ tới giữa pacstrap.
        run: |
          # Inode của netns khởi tạo khác nhau theo phiên bản kernel (ví dụ
          # net:[4026531833] trên runner Ubuntu, net:[4026531840] trên kernel khác)
          # nên phải so với netns thật của runner, không hardcode con số.
          host_netns="$(readlink /proc/self/ns/net)"
          net_mode="$(docker inspect -f '{{ .HostConfig.NetworkMode }}' anios-iso-builder)"
          is_privileged="$(docker inspect -f '{{ .HostConfig.Privileged }}' anios-iso-builder)"
          echo "Runner: netns=$host_netns | Builder: network=$net_mode privileged=$is_privileged"
          docker exec -i \
            --env HOST_NETNS="$host_netns" \
            --env HOST_NET_MODE="$net_mode" \
            --env HOST_PRIVILEGED="$is_privileged" \
            anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          container_netns="$(readlink /proc/self/ns/net)"
          echo "Container: netns=$container_netns | network=${HOST_NET_MODE:-không rõ} privileged=${HOST_PRIVILEGED:-không rõ}"
          if [[ -n "${HOST_NETNS:-}" && "$container_netns" != "$HOST_NETNS" ]]; then
            # Không fatal: pacman ở bước trước đã tải gói thành công nên mạng của
            # container vẫn thông, chỉ là không dùng chung netns với runner.
            echo "::warning::Builder không dùng chung netns với runner (--network host chưa áp dụng)."
          fi
          grep -E '^(CapEff|Seccomp|NoNewPrivs)' /proc/self/status

          probe="$(mktemp -d)"
          mounted=()
          cleanup_probe() {
            local target
            for target in "${mounted[@]}"; do
              umount --lazy "$target" 2>/dev/null || true
            done
            rm -rf -- "$probe"
          }
          trap cleanup_probe EXIT

          fail=0
          try_mount() {
            local label="$1" source="$2" target err
            shift 2
            target="$probe/$label"
            mkdir -p -- "$target"
            if err="$(mount "$source" "$@" "$target" 2>&1)"; then
              echo "OK   : mount $source $* -> $target"
              mounted+=("$target")
            else
              echo "::error::mount $source $* -> $target thất bại: ${err:-không rõ nguyên nhân}"
              fail=1
            fi
            return 0
          }

          # Đúng thứ tự và tham số pacstrap dùng khi dựng chroot.
          try_mount proc   proc   -t proc     -o nosuid,noexec,nodev
          try_mount sys    sys    -t sysfs    -o nosuid,noexec,nodev,ro
          try_mount dev    dev    -t devtmpfs -o mode=0755,nosuid
          try_mount devpts devpts -t devpts   -o mode=0620,gid=5,nosuid,noexec
          try_mount shm    shm    -t tmpfs    -o mode=1777,nosuid,nodev
          try_mount run    /run   --bind --make-private
          try_mount tmp    tmp    -t tmpfs    -o mode=1777,strictatime,nodev,nosuid

          if (( fail )); then
            echo "::error::Container không mount đủ API filesystem mà pacstrap cần."
            echo "::error::Nguyên nhân thường gặp: builder thiếu --privileged (đang là ${HOST_PRIVILEGED:-?}), seccomp/apparmor chặn mount, hoặc container nằm trong user namespace (devtmpfs không mount được ngoài init user namespace)."
            exit 1
          fi
          echo "Container mount được proc/sysfs/devtmpfs/devpts/tmpfs và bind /run — pacstrap sẵn sàng chạy."
          ARCH

      - name: Dựng ISO
        run: |
          docker exec -i anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          df -h "$GITHUB_WORKSPACE"
          ./scripts/build-iso.sh --output "$GITHUB_WORKSPACE/out" --work "$GITHUB_WORKSPACE/work"
          ARCH

      - name: Kiểm tra ISO vừa dựng
        # Xác nhận đúng kernel zen, có boot record El Torito (BIOS/UEFI) và ghi checksum.
        run: |
          docker exec -i anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          iso="out/$(basename "$(ls -1 out/*.iso)")"
          ls -lh "$iso"
          if (( $(stat -c %s "$iso") < 1000000000 )); then
            echo "::error::ISO quá nhỏ, nhiều khả năng dựng lỗi"
            exit 1
          fi
          ( cd out && sha256sum "$(basename "$iso")" >"$(basename "$iso").sha256" )
          cat "out/$(basename "$iso").sha256"

          # Boot record của ISO (El Torito cho BIOS và UEFI).
          xorriso -indev "$iso" -report_el_torito plain >out/iso-el-torito.txt
          cat out/iso-el-torito.txt

          # Menu GRUB của ISO phải có theme Evangelion Ayanami và cấu hình nạp theme.
          xorriso -indev "$iso" -osirrox on \
            -extract /boot/grub/grub.cfg out/iso-grub.cfg \
            -extract /boot/grub/themes/ayanami/theme.txt out/iso-ayanami-theme.txt
          grep -qF '/themes/ayanami/theme.txt' out/iso-grub.cfg
          grep -qF 'evangelion-index-01' out/iso-grub.cfg
          grep -qF 'cow_label=ANIOS_PERSIST' out/iso-grub.cfg
          grep -qF '${anios_cow}' out/iso-grub.cfg
          grep -qF 'copytoram=n' out/iso-grub.cfg
          grep -qF 'Evangelion ayanami-1080p-menu Regular 38' out/iso-ayanami-theme.txt
          echo "ISO có menu GRUB Evangelion (Ayanami) hoàn chỉnh"

          # ISO phải boot linux-zen, không được còn entry trỏ tới kernel generic.
          xorriso -indev "$iso" -ls /arch/boot/x86_64 >out/iso-boot-dir.txt
          grep -E 'vmlinuz|initramfs' out/iso-boot-dir.txt
          grep -q 'vmlinuz-linux-zen' out/iso-boot-dir.txt
          if grep -qE '(vmlinuz|initramfs)-linux(\.img)?$' out/iso-boot-dir.txt; then
            echo "::error::ISO vẫn còn entry boot trỏ tới kernel generic"
            exit 1
          fi

          # Danh sách gói để đối chiếu phiên bản.
          xorriso -indev "$iso" -osirrox on -extract /arch/pkglist.x86_64.txt \
            "$GITHUB_WORKSPACE/out/anios-pkglist.txt"
          echo "Số gói trong live image: $(wc -l <out/anios-pkglist.txt)"
          grep -q '^linux-zen ' out/anios-pkglist.txt
          grep -q '^sddm ' out/anios-pkglist.txt
          grep -q '^ibus ' out/anios-pkglist.txt
          grep -q '^ibus-unikey ' out/anios-pkglist.txt
          # Gói cài sẵn theo yêu cầu: python, nodejs, wine, flatpak và bộ công cụ
          # để yay dựng được gói AUR ngay trong phiên live.
          for pkg in python python-pip nodejs npm wine winetricks flatpak base-devel git \
                     jre-openjdk qt5-base ttf-liberation; do
            grep -q "^$pkg " out/anios-pkglist.txt || {
              echo "::error::Ảnh live thiếu gói $pkg"
              exit 1
            }
          done
          # Gói AUR: yay (trợ giúp AUR), coccoc-browser-stable (Cốc Cốc),
          # legacy-launcher (launcher Minecraft). pkglist do mkarchiso sinh ra SAU
          # bước customize_airootfs.sh nên ba gói này phải có mặt ở đây; bước
          # "Kiểm tra gói AUR trong ảnh live" bên dưới còn đọc thẳng pacman DB
          # trong airootfs.sfs để chắc chắn.
          for pkg in yay coccoc-browser-stable legacy-launcher; do
            grep -q "^$pkg " out/anios-pkglist.txt || {
              echo "::error::Gói AUR $pkg không được dựng vào ảnh live"
              echo "::error::Xem các dòng 'AniOS:' trong log bước 'Dựng ISO'"
              exit 1
            }
          done
          # `go` chỉ là makedepend của yay lúc dựng; nó phải bị gỡ khỏi ảnh.
          if grep -q '^go ' out/anios-pkglist.txt; then
            echo "::error::makedepend 'go' vẫn nằm trong ảnh live (phải được gỡ sau khi dựng yay)"
            exit 1
          fi
          ARCH

      - name: Kiểm tra định danh và giao diện AniOS trong ảnh live
        # Đọc thẳng airootfs.sfs để chắc chắn bản sắc "AniOS" và giao diện đăng
        # nhập có mặt trong ảnh live, không chỉ nằm trong repository.
        run: |
          docker exec -i anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          iso="out/$(basename "$(ls -1 out/*.iso)")"
          xorriso -indev "$iso" -osirrox on -extract /arch/x86_64/airootfs.sfs out/airootfs.sfs
          ls -lh out/airootfs.sfs

          squashfs=out/airootfs.sfs
          os_release="$(unsquashfs -cat "$squashfs" etc/os-release)"
          grep -qxF 'NAME="AniOS"' <<<"$os_release"
          grep -qxF 'ID=arch' <<<"$os_release"
          grep -q '^IMAGE_ID=anios$' <<<"$os_release"
          echo "os-release: $(grep -E '^(NAME|PRETTY_NAME|ID|IMAGE_ID|IMAGE_VERSION)=' <<<"$os_release" | tr '\n' ' ')"

          # Đọc thẳng từng file trong ảnh nén: thiếu file hay sai nội dung đều đỏ.
          for path in \
            usr/share/anios/wallpaper.png \
            usr/share/anios/logo.txt \
            usr/share/sddm/themes/anios/Main.qml \
            usr/share/sddm/themes/anios/theme.conf \
            usr/share/sddm/themes/wuwa/Main.qml \
            usr/share/sddm/themes/wuwa/theme.conf \
            usr/share/sddm/themes/wuwa/bg.mp4 \
            usr/share/sddm/themes/wuwa/fallback.png \
            usr/share/sddm/themes/wuwa/metadata.desktop \
            usr/share/sddm/themes/wuwa/UPSTREAM \
            usr/share/wayland-sessions/anios.desktop \
            usr/share/wayland-sessions/anios-imi.desktop \
            usr/share/anios/skel/.config/hypr/hyprland.lua \
            usr/share/anios/skel/.config/hypr/hyprlock.conf \
            usr/share/anios/skel/.config/quickshell/imi/shell.qml \
            usr/share/anios/skel/.config/matugen/config.toml \
            home/anios/.config/hypr/hyprland.lua \
            home/anios/.bashrc \
            home/anios/Desktop/README.txt; do
            unsquashfs -cat "$squashfs" "$path" >/dev/null ||
              { echo "::error::Thiếu $path trong ảnh live"; exit 1; }
          done
          echo "Ảnh live có wallpaper, logo, giao diện SDDM AniOS và cấu hình desktop"

          anios_theme_conf="$(unsquashfs -cat "$squashfs" usr/share/sddm/themes/anios/theme.conf)"
          grep -qxF 'background=/usr/share/anios/wallpaper.png' <<<"$anios_theme_conf"
          hypr_lua_conf="$(unsquashfs -cat "$squashfs" usr/share/anios/skel/.config/hypr/hyprland.lua)"
          grep -qF 'swaybg -i /usr/share/anios/wallpaper.png' <<<"$hypr_lua_conf"

          # mkarchiso chép airootfs bằng cp --no-preserve=mode, nên nếu quên
          # khai báo trong file_permissions thì script mất bit thực thi và
          # SDDM không khởi chạy được phiên AniOS (còn anios-steam-quit mất
          # bit thực thi thì Steam không thoát êm lúc tắt máy).
          #
          # Danh sách kiểm tra lấy THẲNG từ ANIOS_FILE_PERMISSIONS mà
          # scripts/build-iso.sh khai báo với mkarchiso, thay vì giữ thêm một bản
          # chép tay: hai bản chép tay lệch nhau chính là thứ từng làm hỏng lượt
          # dựng với "Failed to declare file_permissions entry:
          # ["/usr/local/bin/anios-steam-quit"]="0:0:755"". CI luôn dựng kèm gói
          # AUR nên ba helper của installer cũng có mặt trong ảnh.
          #
          # Trích từng tệp ra đĩa rồi hỏi `stat` cho chắc: định dạng của
          # `unsquashfs -ll` không phải là API ổn định, còn quyền tệp thì có.
          mapfile -t perm_entries < <(
            sed -nE '/^[[:space:]]*ANIOS_FILE_PERMISSIONS\+?=\(/,/^[[:space:]]*\)/p' \
              scripts/build-iso.sh | grep -E "^[[:space:]]*['\"]/" | tr -d "'\" "
          )
          if (( ${#perm_entries[@]} == 0 )); then
            echo "::error::Không đọc được ANIOS_FILE_PERMISSIONS từ scripts/build-iso.sh"
            exit 1
          fi
          perm_paths=()
          for entry in "${perm_entries[@]}"; do
            perm_paths+=("${entry%%:*}")
          done

          perm_dump=out/anios-permissions
          rm -rf "$perm_dump"
          unsquashfs -q -no-progress -d "$perm_dump" "$squashfs" \
            "${perm_paths[@]#/}" ||
            { echo "::error::Không trích được các tệp cần kiểm tra quyền"; exit 1; }

          check_mode() {
            local path="$1" want="$2" mode
            mode="$(stat -c '%a' "$perm_dump/$path" 2>/dev/null)"
            if [[ "$mode" != "$want" ]]; then
              echo "::error::$path có quyền '$mode', cần '$want'"
              exit 1
            fi
            echo "  OK $path $mode"
          }
          for entry in "${perm_entries[@]}"; do
            check_mode "${entry%%:*}" "${entry##*:}"
          done

          sddm_conf="$(unsquashfs -cat "$squashfs" etc/sddm.conf.d/10-anios-autologin.conf)"
          grep -qxF 'Current=wuwa' <<<"$sddm_conf"
          grep -qxF 'User=anios' <<<"$sddm_conf"
          wuwa_qml="$(unsquashfs -cat "$squashfs" usr/share/sddm/themes/wuwa/Main.qml)"
          grep -qF 'interval: 1200' <<<"$wuwa_qml"
          grep -qF 'onErrorOccurred: root.videoReady = false' <<<"$wuwa_qml"
          echo "SDDM dùng theme Wuthering Waves, có fallback video và tự đăng nhập tài khoản live"

          # Mật khẩu 1111 phải được nướng vào /etc/shadow từ lúc build (pacman
          # hook anios-live-user.hook). Autologin SDDM đi qua stack
          # `sddm-autologin` (pam_permit) nên luôn vào được desktop; nhưng
          # đăng nhập lại bằng tay đi qua stack `sddm` (pam_unix) và chỉ
          # nhận đúng hash thật. Thiếu hash = người dùng không bao giờ đăng
          # nhập lại được (access denied) kể cả khi service lúc boot có chạy.
          shadow_dump="$(mktemp)"
          unsquashfs -cat "$squashfs" etc/shadow >"$shadow_dump"
          anios_line="$(grep '^anios:' "$shadow_dump" || true)"
          if [[ -z "$anios_line" ]]; then
            echo "::error::etc/shadow trong ảnh live không có tài khoản anios"
            rm -f "$shadow_dump"
            exit 1
          fi
          anios_hash="${anios_line#anios:}"; anios_hash="${anios_hash%%:*}"
          case "$anios_hash" in
            \$*) ;;
            *)
              echo "::error::Mật khẩu anios trong etc/shadow không phải hash ('${anios_hash}'); SDDM sẽ báo access denied"
              rm -f "$shadow_dump"
              exit 1
              ;;
          esac
          # Xác thực hash đúng là của 1111 (không chỉ có mặt một hash bất kỳ):
          # tính lại crypt(1111, hash) bằng libxcrypt — đúng cơ chế pam_unix
          # dùng khi SDDM xác minh mật khẩu — rồi so với hash trong ảnh.
          # Biên dịch chương trình xác minh nhỏ bằng gcc (base-devel luôn có)
          # và liên kết -lcrypt (libxcrypt, luôn có cùng glibc).
          # (Không dùng `passwd --verify`: passwd của Arch không có option đó,
          # lệnh sai này luôn thất bại dù hash đúng.)
          cat > /tmp/anios-hash-verify.c <<'CEOF'
          #include <stdio.h>
          #include <string.h>

          /* Prototype thay cho crypt.h để không phụ thuộc vị trí header. */
          char *crypt(const char *key, const char *setting);

          int main(int argc, char **argv) {
              char *recomputed;
              if (argc != 3)
                  return 2;
              recomputed = crypt(argv[1], argv[2]);
              if (recomputed == NULL)
                  return 1;
              return strcmp(recomputed, argv[2]) == 0 ? 0 : 1;
          }
          CEOF
          gcc -O2 -o /tmp/anios-hash-verify /tmp/anios-hash-verify.c -lcrypt
          if /tmp/anios-hash-verify 1111 "$anios_hash"; then
            echo "Hash mật khẩu anios trong ảnh live xác thực đúng 1111"
          else
            echo "::error::Hash mật khẩu anios trong ảnh live không khớp 1111"
            rm -f /tmp/anios-hash-verify /tmp/anios-hash-verify.c
            rm -f "$shadow_dump"
            exit 1
          fi
          rm -f /tmp/anios-hash-verify /tmp/anios-hash-verify.c
          rm -f "$shadow_dump"

          # Hook build phải đã bị hook dọn dẹp zzzz99 của releng xoá khỏi ảnh,
          # nếu không nó sẽ chạy lại ở mọi thao tác pacman trong phiên live.
          # Hỏi thẳng etc/pacman.d/hooks và không dùng `| grep -q` trên toàn ảnh:
          # `grep -q` đóng ống sớm sẽ làm `unsquashfs -ll` nhận SIGPIPE (141)
          # dưới `set -o pipefail`.
          if unsquashfs -ll "$squashfs" etc/pacman.d/hooks 2>/dev/null | grep -F 'anios-live-user.hook' >/dev/null; then
            echo "::error::anios-live-user.hook còn nằm trong ảnh live"
            exit 1
          fi
          echo "Mật khẩu 1111 có sẵn trong ảnh; hook build đã được dọn sạch"
          ARCH

      - name: Kiểm tra âm thanh trong ảnh live
        # Không thể "nghe thử" trong CI nên scripts/check-live-audio.sh đọc thẳng
        # airootfs.sfs để xác nhận dàn âm thanh có thật và tự khởi động cùng
        # phiên live: plugin SPA ALSA, cấu hình ALSA trỏ về PipeWire, unit người
        # dùng của PipeWire/pipewire-pulse/WirePlumber, drop-in cùng symlink do
        # AniOS bật sẵn, và công cụ chẩn đoán của AniOS.
        #
        # Logic nằm trong script chứ không inline ở đây vì nó phải TỰ đi theo
        # symlink: `unsquashfs -cat` từ chối symlink tuyệt đối, mà
        # pipewire-alsa/pipewire-audio cài /etc/alsa/conf.d/*.conf và systemd
        # enable unit người dùng đều bằng symlink tuyệt đối. Script có bài tự
        # kiểm tra scripts/selftest-check-live-audio.sh, chạy ở workflow
        # "AniOS profile checks" để bắt lỗi kiểu này trong vài giây thay vì sau
        # một lượt dựng ISO dài.
        run: |
          docker exec -i anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          squashfs=out/airootfs.sfs
          if [[ ! -s "$squashfs" ]]; then
            iso="out/$(basename "$(ls -1 out/*.iso)")"
            xorriso -indev "$iso" -osirrox on -extract /arch/x86_64/airootfs.sfs "$squashfs"
          fi
          ls -lh "$squashfs"
          /workspace/scripts/check-live-audio.sh "$squashfs" out/anios-pkglist.txt
          ARCH

      - name: Kiểm tra gói AUR, python, nodejs, wine trong ảnh live
        # pkglist chỉ nói rằng gói "đã được cài"; bước này đọc thẳng airootfs.sfs
        # bằng scripts/check-live-aur.sh để xác nhận:
        #   * yay, coccoc-browser-stable, legacy-launcher có trong pacman DB của
        #     ảnh (var/lib/pacman/local), kèm binary thật (usr/bin/yay...),
        #   * python/python-pip, nodejs/npm, wine/winetricks, base-devel/git,
        #     jre-openjdk, qt5-base, ttf-liberation đều có mặt,
        #   * bước dựng gói AUR không để lại rác: /root/.anios-aur, hook
        #     customize_airootfs.sh, /var/tmp/anios-aur-build, tài khoản tạm
        #     aniosbuild trong /etc/passwd, và KHÔNG có luật sudo NOPASSWD nào
        #     lọt vào ảnh (scripts/anios-aur-build.sh không dùng sudo).
        #
        # Script chỉ hỏi metadata bằng `unsquashfs -ll` và chỉ `-cat` những entry
        # đã xác nhận là file thường, vì `unsquashfs -cat` từ chối symlink tuyệt
        # đối (README.md mô tả chi tiết). Logic đó được kiểm chứng ngoại tuyến bởi
        # scripts/selftest-check-live-aur.sh trong workflow "AniOS profile checks".
        run: |
          docker exec -i anios-iso-builder bash -e -o pipefail -s <<'ARCH'
          squashfs=out/airootfs.sfs
          if [[ ! -s "$squashfs" ]]; then
            iso="out/$(basename "$(ls -1 out/*.iso)")"
            xorriso -indev "$iso" -osirrox on -extract /arch/x86_64/airootfs.sfs "$squashfs"
          fi
          /workspace/scripts/check-live-aur.sh "$squashfs" out/anios-pkglist.txt
          ARCH

      - name: Dọn container dựng Arch
        if: always()
        run: docker rm --force anios-iso-builder || true

      - name: Lưu ISO làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: anios-iso
          path: |
            out/*.iso
            out/*.sha256
            out/anios-pkglist.txt
            out/iso-el-torito.txt
          # ISO đã nén sẵn, nén thêm chỉ tốn thời gian.
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Kiểm tra điều kiện phát hành
        id: gate
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: |
          if [[ "$IS_TAG" == 'true' || "$PUBLISH" == 'true' || "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            echo "release=true" >>"$GITHUB_OUTPUT"
          else
            echo "release=false" >>"$GITHUB_OUTPUT"
            echo "Bản dựng này chỉ lưu artifact, không tạo release."
          fi

      - name: Chuẩn bị nội dung release
        id: meta
        if: steps.gate.outputs.release == 'true'
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          iso="out/$(basename "$(ls -1 out/*.iso)")"
          name_iso="$(basename "$iso")"
          sha="$(cut -d' ' -f1 "out/$name_iso.sha256")"
          size_h="$(numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c %s "$iso")")"
          packages="$(wc -l <out/anios-pkglist.txt)"

          if [[ "$IS_TAG" == 'true' ]]; then
            tag="$GITHUB_REF_NAME"
            title="AniOS $GITHUB_REF_NAME"
            prerelease=false
            latest=true
          else
            tag=nightly
            title="AniOS nightly ($(date -u +%Y-%m-%d))"
            prerelease=true
            latest=false
          fi

          # GitHub chỉ nhận tệp đính kèm dưới 2 GB qua API, ISO thường nặng hơn.
          files=""
          if (( $(stat -c %s "$iso") <= 2 * 1024 * 1024 * 1024 - 1 )); then
            files="$iso"$'\n'
            iso_note="Tệp ISO nằm trong phần đính kèm của release này."
          else
            iso_note="ISO nặng hơn giới hạn 2 GB của tệp đính kèm release. Tải bản artifact tại $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (mục Artifacts, tên anios-iso)."
          fi
          files+="out/$name_iso.sha256"$'\n'"out/anios-pkglist.txt"$'\n'"out/iso-el-torito.txt"

          {
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "make_latest=$latest"
            echo 'files<<ANIOS_ASSETS'
            printf '%s\n' "$files"
            echo 'ANIOS_ASSETS'
          } >>"$GITHUB_OUTPUT"

          {
            echo "### AniOS \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo
            echo "$iso_note"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| File | \`$name_iso\` |"
            echo "| Dung lượng | $size_h |"
            echo "| SHA256 | \`$sha\` |"
            echo "| Số gói | $packages |"
            echo "| Kernel | \`linux-zen\` |"
            echo
            echo "Kiểm tra file sau khi tải:"
            echo
            echo '```bash'
            echo "sha256sum -c $name_iso.sha256"
            echo '```'
            echo
            echo "Ghi ra USB (thay \`/dev/sdX\` bằng ổ USB của bạn):"
            echo
            echo '```bash'
            echo "sudo dd if=$name_iso of=/dev/sdX bs=4M status=progress conv=fsync"
            echo '```'
            echo
            echo "Sau khi boot, AniOS tự đăng nhập tài khoản live \`anios\` và mở Hyprland. Trên USB thường, game và thiết lập không được giữ lại sau khi tắt máy."
          } >release-notes.md

      - name: Cập nhật GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # softprops/action-gh-release dùng `tag_name`, không phải `tag`.
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release-notes.md
          files: ${{ steps.meta.outputs.files }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          fail_on_unmatched_files: true
